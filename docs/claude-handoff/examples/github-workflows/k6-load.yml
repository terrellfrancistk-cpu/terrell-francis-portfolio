# Draft workflow. Add in a PR. Never load-test production. Staging only.
# Run a baseline before any speed fix, then the same smoke after.
name: k6-load
on:
  workflow_dispatch:
    inputs:
      label:
        description: "baseline or post-fix label"
        required: true
        default: "baseline"
jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
      - name: Refuse production URL
        env:
          K6_BASE_URL: ${{ secrets.K6_BASE_URL }}
        run: |
          set -e
          if [ -z "$K6_BASE_URL" ]; then echo "K6_BASE_URL missing"; exit 1; fi
          echo "$K6_BASE_URL" | grep -Eqi 'rork\.(app|live|work)|tryzilt\.app|getoncurb\.app|trybooked\.app|tryafterglow\.app|trynoir\.app|tryrole\.app|tryourpeople\.app|apexpeakofcare\.app|tkhub\.app' && {
            echo "Refusing production host"
            exit 1
          }
      - name: k6 smoke 50 VUs 2m
        env:
          K6_BASE_URL: ${{ secrets.K6_BASE_URL }}
        run: |
          mkdir -p loadtest/results
          if [ -f loadtest/smoke.js ]; then
            k6 run --vus 50 --duration 2m --out json=loadtest/results/k6-${{ github.event.inputs.label || 'baseline' }}.json loadtest/smoke.js
          else
            echo "Add loadtest/smoke.js (staging only, no real user data) before this job can run a real mix."
            echo "Placeholder recorded." > loadtest/results/README.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-${{ github.event.inputs.label || 'baseline' }}
          path: loadtest/results/
          retention-days: 30
