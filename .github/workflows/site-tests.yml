# Draft (Claude, 2026-11-13). Runs the site test suite against a local static server.
# Never deploys, never touches gh-pages, never loads a production host (tests/guard.mjs fails closed).
# Triggers: pull requests and manual runs only. Merge only with Terrell's OK.
name: site-tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "index.html"
      - "styles.css"
      - "script.js"
      - "404.html"
      - "privacy/**"
      - "assets/**"
      - "tests/**"
      - ".github/workflows/site-tests.yml"
permissions:
  contents: read
concurrency:
  group: site-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci || npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run the suite (local server; production hosts refused)
        run: npx playwright test --trace off --reporter=list,html
      - name: Run the suite again against the minified build pages.yml would publish
        run: bash prod-build-check.sh --reporter=list
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: site-tests-report
          path: |
            tests/playwright-report/
            tests/test-results/
          retention-days: 7
