name: Deploy to GitHub Pages

# GitHub Pages for this repo serves the gh-pages branch (root).
# Every push to main is mirrored to gh-pages, which triggers the Pages build.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Minify CSS and JS for production
        run: |
          npx --yes terser@5 script.js --compress --mangle --output script.min.js
          npx --yes clean-css-cli@5 --output styles.min.css styles.css
          mv script.min.js script.js
          mv styles.min.css styles.css
      - name: Publish the minified tree to gh-pages
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add script.js styles.css
          git diff --cached --quiet || git commit -m "Minify CSS and JS for GitHub Pages"
          git push --force origin HEAD:refs/heads/gh-pages
