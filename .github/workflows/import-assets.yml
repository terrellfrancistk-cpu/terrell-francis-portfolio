name: Import site files (one-time)

on:
  push:
    branches: [main]
    paths: ['.github/assets-import.txt', '.github/workflows/import-assets.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download, verify and commit assets
        run: |
          set -euo pipefail
          test -f .github/assets-import.txt || { echo "nothing to import"; exit 0; }
          url=$(sed -n 1p .github/assets-import.txt)
          sha=$(sed -n 2p .github/assets-import.txt)
          ok=0
          for u in "$url" $(curl -fsSL -A "Mozilla/5.0" "$url" | grep -oE '(href|src|action)="[^"]*site-files\.tar[^"]*"' | sed -E 's/^[a-z]+="//; s/"$//' | sed -E 's#^/#https://tmpfiles.org/#' | sort -u); do
            echo "trying: $u"
            curl -fsSL -A "Mozilla/5.0" -e "$url" "$u" -o /tmp/assets.tar || continue
            ls -l /tmp/assets.tar; file /tmp/assets.tar
            if echo "$sha  /tmp/assets.tar" | sha256sum -c -; then ok=1; break; fi
          done
          [ "$ok" = 1 ] || { echo "no matching download"; curl -fsSL -A "Mozilla/5.0" "$url" | grep -oE '(href|src|action)="[^"]*"' | head -40; exit 1; }
          tar -xvf /tmp/assets.tar
          git rm -q .github/assets-import.txt
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add site files (HTML, CSS, JS, resume PDF, fonts, images)"
          git push
