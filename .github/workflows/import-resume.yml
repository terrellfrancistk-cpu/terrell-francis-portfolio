name: Import resume PDF (one-time)

on:
  push:
    branches: [main]
    paths: ['.github/resume-import.txt', '.github/workflows/import-resume.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download, verify (sha256) and commit resume PDF
        run: |
          set -euo pipefail
          test -f .github/resume-import.txt || { echo "nothing to import"; exit 0; }
          url=$(sed -n 1p .github/resume-import.txt)
          sha=$(sed -n 2p .github/resume-import.txt)
          ok=0
          for u in $(curl -fsSL -A "Mozilla/5.0" "$url" | grep -oE 'href="https://tmpfiles\.org/dl/[^"]*"' | sed -E 's/^href="//; s/"$//' | sort -u) "$url"; do
            echo "trying: $u"
            curl -fsSL -A "Mozilla/5.0" -e "$url" "$u" -o /tmp/import.pdf || continue
            ls -l /tmp/import.pdf
            if echo "$sha  /tmp/import.pdf" | sha256sum -c -; then ok=1; break; fi
          done
          [ "$ok" = 1 ] || { echo "no matching download"; exit 1; }
          cp /tmp/import.pdf assets/Terrell_Francis_Resume.pdf
          git rm -q .github/resume-import.txt
          git add assets/Terrell_Francis_Resume.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update resume PDF (Portfolio link in header)"
          git push
