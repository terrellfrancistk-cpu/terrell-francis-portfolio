name: Import app logos (one-time)

on:
  push:
    branches: [main]
    paths: ['.github/app-logos.txt', '.github/workflows/import-app-logos.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download, verify (sha256) and commit logo update
        run: |
          set -euo pipefail
          test -f .github/app-logos.txt || { echo "nothing to import"; exit 0; }
          url=$(sed -n 1p .github/app-logos.txt)
          sha=$(sed -n 2p .github/app-logos.txt)
          ok=0
          for u in $(curl -fsSL -A "Mozilla/5.0" "$url" | grep -oE 'href="https://tmpfiles[.]org/dl/[^"]*"' | sed -E 's/^href="//; s/"$//' | sort -u) "$url"; do
            echo "trying: $u"
            curl -fsSL -A "Mozilla/5.0" -e "$url" "$u" -o /tmp/import.tgz || continue
            ls -l /tmp/import.tgz
            if echo "$sha  /tmp/import.tgz" | sha256sum -c -; then ok=1; break; fi
          done
          [ "$ok" = 1 ] || { echo "no matching download"; exit 1; }
          tar -tzf /tmp/import.tgz
          tar --no-same-owner -xzf /tmp/import.tgz -C .
          cat > /tmp/sums.txt <<'SUMS'
          29e1501b1805e003664ea1dd2d2fcf51f55f6608fe9335df4d3571fde207f7cf  index.html
          19c45db1d6ebeb547734e730cd426dd2d6b5cd7f7c87bba11f2c6cddb402f350  styles.css
          9c184376753fc8c31fc5f9ec2eecb02861630d3e8a202263574588059a084ed6  assets/apps/afterglow.png
          4b71b480b098c6e22396a011f0dc8e5532737d740bce0dc3a683dc1af22d758a  assets/apps/apex.png
          a2b2fa373f4374545b8ea9af5cc99831b148d2926429793319d91b5fc76b2cf3  assets/apps/booked.png
          2775c018acdc2afe6d4289e905ea39c20ee95e983e3a51d207d03e98d38d81e9  assets/apps/curb.png
          5a9574331f16a72ab8be261b9c96dbaf08ffde08f3a4ce2e3e3078c3f43327c3  assets/apps/noir.png
          d3e805574dd79a72fd83ba92e80f2f9fc056d563581ae425eac41c991d89bf32  assets/apps/our-people.png
          a2834271b0aef5337dac2856ef3bcb7d6e02a3a191f42da3b5d0679060952338  assets/apps/radr.png
          13ef81d7a2ec861b1b21e306838475c9096e4d0dbae211f795b5e96b92bf85fa  assets/apps/role.png
          fc8c00abb06a63f0b1387b18e131b6a0b45011aa7f2b0c8ef056bc0c12ed082c  assets/apps/wrace.png
          00b99c921287b718b72087c768c727b1601bdedeafbe628bce07ca491ffddf44  assets/apps/zilt.png
          SUMS
          sed -E 's/^ +//' /tmp/sums.txt | sha256sum -c -
          git rm -q .github/app-logos.txt
          git add index.html styles.css assets/apps
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add real app logos to Products I've Built cards"
          git push
