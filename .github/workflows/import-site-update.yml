name: Import site update (one-time)

on:
  push:
    branches: [main]
    paths: ['.github/site-update.txt', '.github/workflows/import-site-update.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download, verify (sha256) and commit site files
        run: |
          set -euo pipefail
          test -f .github/site-update.txt || { echo "nothing to import"; exit 0; }
          url=$(sed -n 1p .github/site-update.txt)
          sha=$(sed -n 2p .github/site-update.txt)
          ok=0
          for u in $(curl -fsSL -A "Mozilla/5.0" "$url" | grep -oE 'href="https://tmpfiles\.org/dl/[^"]*"' | sed -E 's/^href="//; s/"$//' | sort -u) "$url"; do
            echo "trying: $u"
            curl -fsSL -A "Mozilla/5.0" -e "$url" "$u" -o /tmp/import.tgz || continue
            ls -l /tmp/import.tgz
            if echo "$sha  /tmp/import.tgz" | sha256sum -c -; then ok=1; break; fi
          done
          [ "$ok" = 1 ] || { echo "no matching download"; exit 1; }
          tar -tzf /tmp/import.tgz
          tar --no-same-owner -xzf /tmp/import.tgz -C .
          git rm -q .github/site-update.txt
          git add index.html styles.css script.js README.md assets/tkhub-logo.png
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add Products I've Built (TK Hub LLC), footer logo + cross-links, fix back to top"
          git push
